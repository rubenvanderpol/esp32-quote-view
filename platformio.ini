; LilyGO T5-4.7" E-Paper S3 quote display
; https://github.com/Xinyuan-LilyGO/LilyGo-EPD47

[platformio]
default_envs = T5-ePaper-S3
boards_dir = boards

[env]
platform = espressif32@6.12.0
framework = arduino
board = T5-ePaper-S3
upload_speed = 921600
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DLILYGO_T5_EPD47_S3
monitor_filters =
    default
    esp32_exception_decoder
lib_deps =
    lennarthennigs/Button2 @ 2.3.2
    https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#esp32s3
extra_scripts =
    pre:scripts/pre_build_pack.py

[env:T5-ePaper-S3]
extends = env

; USB-JTAG built into ESP32-S3 — used by VS Code / PlatformIO debugger
debug_tool = esp-builtin
debug_init_break = tbreak setup
build_type = debug
