[platformio]
default_envs = T5-ePaper-S3
boards_dir = boards
; LittleFS image source. Only the packed quotes.bin lives here (generated at
; build time); the editable data/quotes.json is not shipped to the device.
data_dir = fs

[env]
platform = espressif32@6.12.0
framework = arduino
board = T5-ePaper-S3
upload_speed = 921600
; Native USB Serial/JTAG: reset into the ROM bootloader over USB, not DTR/RTS.
board_upload.before_reset = usb_reset
monitor_speed = 115200
; Opening the serial monitor must not toggle DTR/RTS (that resets the S3).
monitor_dtr = 0
monitor_rts = 0
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DLILYGO_T5_EPD47_S3
monitor_filters =
    default
    esp32_exception_decoder
lib_deps =
    lennarthennigs/Button2 @ 2.3.2
    lewisxhe/SensorLib @ 0.3.1
    https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#esp32s3
extra_scripts =
    pre:scripts/pre_build_pack.py

[env:T5-ePaper-S3]
extends = env
debug_tool = esp-builtin
debug_init_break = tbreak setup
build_type = debug

; USB debugging: stays awake, polls the button, keeps serial connected.
; Use for day-to-day development; flash T5-ePaper-S3 for battery/deep-sleep builds.
[env:T5-ePaper-S3-no-sleep]
extends = env:T5-ePaper-S3
build_flags =
    ${env:T5-ePaper-S3.build_flags}
    -DENABLE_DEEP_SLEEP=0
